        <p class="p1">O Shibuya-kei (渋谷系, literalmente "estilo de Shibuya") foi um microgênero musical e movimento estético que nasceu em Tóquio no início dos anos 1990, centrado nas lojas de discos importados do bairro de Shibuya (como a HMV e a Tower Records).</p>
